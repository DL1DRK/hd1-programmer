name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript tests
        run: npm test
      - name: PHP syntax check
        run: |
          php -l installer/install.php
          php -l installer/update.php
