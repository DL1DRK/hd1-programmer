name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Release version $VERSION does not match VERSION file $FILE_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          npm test
          php -l installer/install.php
          php -l installer/update.php

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="hd1-programmer-${VERSION}.zip"

          rm -rf dist release
          mkdir -p dist/admin release
          cp -R app/. dist/
          cp installer/update.php dist/admin/update.php
          cp VERSION dist/VERSION
          if [ -f LICENSE ]; then cp LICENSE dist/LICENSE; fi

          (cd dist && zip -qr "../release/${PACKAGE}" .)
          SHA256="$(sha256sum "release/${PACKAGE}" | awk '{print $1}')"

          cat > release/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "channel": "stable",
            "package": "${PACKAGE}",
            "sha256": "${SHA256}",
            "min_php": "8.1",
            "repository": "DL1DRK/hd1-programmer"
          }
          EOF

          cp installer/install.php release/install.php
          (cd release && sha256sum "${PACKAGE}" install.php manifest.json > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              release/* \
              --title "HD1 Programmer $TAG" \
              --generate-notes \
              --verify-tag
          else
            gh release create "$TAG" \
              release/* \
              --target "$GITHUB_SHA" \
              --title "HD1 Programmer $TAG" \
              --generate-notes
          fi
